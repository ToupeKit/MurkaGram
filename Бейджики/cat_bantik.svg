<svg width="220" height="212" viewBox="0 -12 220 212" xmlns="http://www.w3.org/2000/svg" style="background-color: #1e1e1e; border-radius: 16px;">
  <!-- Основной контур головы и левого уха -->
  <path d="M 129.2 52.4
           L 125 55
           Q 100 50 75 55
           L 35 30
           L 45 85
           C 25 115, 35 165, 100 165
           C 165 165, 175 115, 155 85
           L 157.3 72.1"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Кончик правого уха над бантиком -->
  <polyline points="144.9,42.6 165,30 160.3,55.9"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round" />

  <!-- Внутренний треугольник левого уха -->
  <polyline points="48,72 44,46 66,60" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Большой острый бантик (чуть правее) -->
  <g transform="translate(150, 55) rotate(37)">
    <!-- Левое острое крыло -->
    <polygon points="-6,-4 -46,-25 -46,25 -6,4"
             fill="none"
             stroke="#FFFFFF"
             stroke-width="4.5"
             stroke-linejoin="miter" />
    <!-- Правое острое крыло -->
    <polygon points="6,-4 46,-25 46,25 6,4"
             fill="none"
             stroke="#FFFFFF"
             stroke-width="4.5"
             stroke-linejoin="miter" />
    <!-- Острый квадратный узелок в центре -->
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF" />
  </g>

  <!-- Глаза -->
  <ellipse cx="73" cy="102" rx="7" ry="11" fill="#FFFFFF" />
  <ellipse cx="127" cy="102" rx="7" ry="11" fill="#FFFFFF" />

  <!-- Нос -->
  <polygon points="93,120 107,120 100,129" fill="#FFFFFF" />

  <!-- Рот -->
  <path d="M 85 135 Q 92.5 143 100 135 Q 107.5 143 115 135"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4.5"
        stroke-linecap="round" />

  <!-- Усы слева -->
  <line x1="20" y1="115" x2="52" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="15" y1="128" x2="50" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="22" y1="141" x2="53" y2="136" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Усы справа -->
  <line x1="180" y1="115" x2="148" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="185" y1="128" x2="150" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="178" y1="141" x2="147" y2="136" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
</svg>
