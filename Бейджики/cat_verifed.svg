<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #1e1e1e; border-radius: 16px;">
  <!-- Контур головы и ушей -->
  <path d="M 45 85
           L 35 30
           L 75 55
           Q 100 50 125 55
           L 165 30
           L 155 85
           C 175 115, 165 165, 100 165
           C 35 165, 25 115, 45 85 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linejoin="round" />

  <!-- Внутренние треугольники ушей -->
  <polyline points="48,72 44,46 66,60" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />
  <polyline points="152,72 156,46 134,60" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Глаза -->
  <ellipse cx="73" cy="102" rx="7" ry="11" fill="#FFFFFF" />
  <ellipse cx="127" cy="102" rx="7" ry="11" fill="#FFFFFF" />

  <!-- Нос -->
  <polygon points="93,120 107,120 100,129" fill="#FFFFFF" />

  <!-- Рот -->
  <path d="M 85 135 Q 92.5 143 100 135 Q 107.5 143 115 135"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4.5"
        stroke-linecap="round" />

  <!-- Усы слева -->
  <line x1="20" y1="115" x2="52" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="15" y1="128" x2="50" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="22" y1="141" x2="53" y2="136" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Усы справа (верхний и средний чуть укорочены, чтобы не наезжать на бейдж) -->
  <line x1="180" y1="115" x2="148" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="185" y1="128" x2="150" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  <!-- Бейдж с галочкой в правом нижнем углу -->
  <circle cx="163" cy="160" r="22" fill="none" stroke="#FFFFFF" stroke-width="5" />
  <polyline points="152,160 160,168 175,152"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round" />
</svg>
